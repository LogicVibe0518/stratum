[project]
name = "stratum"
version = "0.0.1"
description = "Layer-first poster engine for small social media agencies"
requires-python = ">=3.12,<3.13"

[tool.uv.workspace]
members = ["packages/spec", "apps/api", "apps/worker"]

[dependency-groups]
dev = [
  "ruff",
  "mypy",
  "pytest",
  "pytest-cov",
  "hypothesis",
  "pre-commit",
  "httpx",
  "pillow",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101"]  # assert is fine in tests

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["stratum_spec", "stratum_api", "stratum_worker"]

[[tool.mypy.overrides]]
module = ["resvg.*", "fontTools.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["packages", "apps"]
addopts = "-q"
