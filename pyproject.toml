[project]
name = "stratum"
version = "0.0.1"
description = "Layer-first poster engine for small social media agencies"
requires-python = ">=3.12,<3.13"

[tool.uv.workspace]
members = ["packages/spec", "apps/api", "apps/worker"]

[dependency-groups]
dev = [
  "ruff",
  "mypy",
  "pytest",
  "pytest-cov",
  "hypothesis",
  "pre-commit",
  "httpx",
  "pillow",
  "pytest-asyncio",
  "asyncpg",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101"]  # assert is fine in tests

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["stratum_spec", "stratum_api", "stratum_worker"]

[[tool.mypy.overrides]]
module = ["resvg.*", "fontTools.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["packages", "apps"]
addopts = "-q"
asyncio_mode = "auto"
markers = ["live: makes real, paid provider calls; skipped unless STRATUM_LIVE=1 (make live)"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's whole dependency system is `Depends(...)` in a default argument. B008
# exists to catch mutable defaults, which these are not - they are the framework's
# documented API. Listing them here is the supported fix; scattering noqa comments
# over every route would hide real B008s later.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Header",
    "fastapi.Query",
    "fastapi.Form",
    "fastapi.File",
    "fastapi.Body",
    "fastapi.Path",
]
