[project]
name = "stratum-worker"
version = "0.0.1"
description = "Stratum workflows, compositor and AI gateway"
requires-python = ">=3.12,<3.13"
dependencies = ["stratum-spec", "resvg>=0.2", "fonttools>=4.50"]
# M7 adds: dbos. M2 adds: pyvips. Add when the module starts.

[project.scripts]
stratum-render = "stratum_worker.cli:main"

[tool.uv.sources]
stratum-spec = { workspace = true }

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "stratum_worker"
