[project]
name = "stratum-worker"
version = "0.0.1"
description = "Stratum workflows, compositor and AI gateway"
requires-python = ">=3.12,<3.13"
dependencies = [
  "stratum-spec",
  "resvg>=0.2",
  "fonttools>=4.50",
  "pillow>=11.0",
  "numpy>=2.0",
  "httpx>=0.27",
  "pydantic-settings",
  "python-dotenv",
]
# M7 adds: dbos. Add when the module starts.

[project.scripts]
stratum-render = "stratum_worker.cli:main"
stratum-draft = "stratum_worker.draft.cli:main"
stratum-batch = "stratum_worker.draft.batch:main"
stratum-queue = "stratum_worker.queue.worker:main"

[tool.uv.sources]
stratum-spec = { workspace = true }

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "stratum_worker"
