<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Stratum</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns=%22http://www.w3.org/2000/svg%22%20viewBox=%220%200%2024%2024%22%3E%3Cstyle%3Erect%7Bfill:#09090b%7D@media%20(prefers-color-scheme:dark)%7Brect%7Bfill:#fafafa%7D%7D%3C/style%3E%3Crect%20x=%223%22%20y=%223.5%22%20width=%2218%22%20height=%224.75%22%20rx=%221.6%22/%3E%3Crect%20x=%226%22%20y=%229.6%22%20width=%2215%22%20height=%224.75%22%20rx=%221.6%22%20opacity=%22.62%22/%3E%3Crect%20x=%223%22%20y=%2215.75%22%20width=%2212%22%20height=%224.75%22%20rx=%221.6%22%20opacity=%22.34%22/%3E%3C/svg%3E" />
    <script>
      // The theme before the first paint, so a dark-mode user never sees a white flash.
      try {
        var stored = localStorage.getItem("stratum.theme");
        if (stored === "light" || stored === "dark") {
          document.documentElement.setAttribute("data-theme", stored);
        }
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
