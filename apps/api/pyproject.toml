[project]
name = "stratum-api"
version = "0.0.1"
description = "Stratum HTTP API"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi", "uvicorn[standard]", "pydantic-settings", "stratum-spec"]

[tool.uv.sources]
stratum-spec = { workspace = true }

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "stratum_api"
